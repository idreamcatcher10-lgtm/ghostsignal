name: Deploy GhostSignal to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "ghostsignal-pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install development dependencies
        run: npm install --no-audit --no-fund
      - name: Build and test GhostSignal
        run: npm run check
      - name: Confirm web entry point
        run: test -f dist/index.html && test -f dist/sw.js && test -f dist/manifest.webmanifest
      - name: Prepare artifact for static hosting
        run: touch dist/.nojekyll
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke-test:
    name: Verify live HTTPS site and offline assets
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: read
    env:
      SITE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - name: Check deployed HTML, PWA manifest and QR decoder
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SITE_URL"
          echo "Checking public site: $SITE_URL"
          for attempt in $(seq 1 12); do
            if curl -fsSL --max-time 20 "$SITE_URL" -o /tmp/ghostsignal-index.html && grep -qi "GhostSignal" /tmp/ghostsignal-index.html; then
              echo "Live HTML verified."
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "Page did not become available after deployment." >&2
              exit 1
            fi
            sleep 5
          done
          for path in assets/main.js assets/codec.js assets/styles.css assets/qr-vendor.js assets/jsqr.js sw.js manifest.webmanifest assets/icon-192.png; do
            curl -fsSL --retry 6 --retry-delay 3 --retry-all-errors --max-time 30 "${SITE_URL%/}/$path" -o /tmp/ghostsignal-asset
            test -s /tmp/ghostsignal-asset
            echo "Verified $path"
          done
          echo "All publicly served app assets passed the HTTP smoke test."
