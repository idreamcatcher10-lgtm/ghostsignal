name: Import GhostSignal MVP source
on:
  push:
    paths:
      - 'bootstrap/ghostsignal-mvp.tar.xz.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    name: Verify and expand initial source snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Verify source archive and expand project
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode bootstrap/ghostsignal-mvp.tar.xz.b64 > /tmp/ghostsignal-mvp.tar.xz
          echo 'e931143a6f407ad9115d64118888f53aa25444aecd3f73a196aa7d572c43155d  /tmp/ghostsignal-mvp.tar.xz' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import PurePosixPath
          import tarfile
          with tarfile.open('/tmp/ghostsignal-mvp.tar.xz', mode='r:xz') as archive:
              for member in archive.getmembers():
                  name = member.name
                  path = PurePosixPath(name)
                  if path.is_absolute() or '..' in path.parts or not (member.isfile() or member.isdir()):
                      raise SystemExit(f'Unsafe archive entry: {name}')
              archive.extractall('.', filter='data')
          PY
          test -f src/main.ts
          test -f src/codec.ts
          test -f index.html
          test -f .kiro/specs/ghostsignal/requirements.md
          test -f LICENSE
          test -f dist/index.html
          rm -rf bootstrap

      - name: Verify bundled protocol tests
        shell: bash
        run: |
          node --version
          node --test tests/codec.test.mjs

      - name: Publish complete source and static build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Import complete GhostSignal MVP source and deployment build"
          git push origin HEAD:main
