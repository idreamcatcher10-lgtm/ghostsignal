name: Import GhostSignal MVP source
on:
  push:
    paths:
      - "bootstrap/READY"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-source:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unpack verified GhostSignal source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f bootstrap/READY
          cat bootstrap/chunk-*.txt | base64 --decode > /tmp/ghostsignal-source.tar.xz
          tar -tJf /tmp/ghostsignal-source.tar.xz > /tmp/ghostsignal-files.txt
          if grep -E '^(/|\./\.\./|\.\./)' /tmp/ghostsignal-files.txt; then
            echo "Unsafe archive paths" >&2
            exit 1
          fi
          tar -xJf /tmp/ghostsignal-source.tar.xz --no-same-owner
          rm -rf bootstrap .github/workflows/bootstrap-import.yml
          git config user.name "ghostsignal-import[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import GhostSignal MVP source, build, documentation and Kiro handoff"
          git push origin HEAD:main
